site_name: GoRadio
site_description: A lightweight, general-purpose radio streaming server.
site_url: https://tmfksoft.github.io/goradio/
repo_url: https://github.com/tmfksoft/goradio
repo_name: tmfksoft/goradio
edit_uri: edit/main/docs/content/

docs_dir: content

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - CLI Reference:
      - radio serve: cli/serve.md
      - radio station: cli/station.md
      - radio tokengen: cli/tokengen.md
  - Configuration:
      - Audio server (server.yaml): configuration/server-config.md
      - Station controller (station.yaml): configuration/station-config.md
  - Lua Scripting API:
      - Overview: lua-api/index.md
      - Registering & Queueing: lua-api/register-queue-status.md
      - Events & Scheduling: lua-api/events-and-scheduling.md
      - HTTP & SQL Modules: lua-api/http-and-sql-modules.md
      - Redis Module: lua-api/redis-module.md
      - Editor Support (VS Code): lua-api/editor-support.md
  - Developer / Protocol API:
      - Overview: developer-api/index.md
      - Protocol Reference: developer-api/protocol-reference.md
      - Writing a Controller: developer-api/writing-a-controller.md
