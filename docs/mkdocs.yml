site_name: GoRadio
site_description: A lightweight, general-purpose radio streaming server.
site_url: https://goradioserver.github.io/goradio/
repo_url: https://github.com/goradioserver/goradio
repo_name: goradioserver/goradio
edit_uri: edit/main/docs/content/

docs_dir: content

theme:
  name: goradio

  # No palette block here on purpose. The theme ships one locked dark
  # scheme wired to GoRadio's brand through custom CSS variables rather
  # than one of Material's named palettes, so overriding it would undo
  # the reason for adopting the theme. Same for font, logo and favicon.
  #
  # features is restated in full rather than added to, because MkDocs
  # *replaces* a theme's list instead of merging into it -- setting only
  # content.action.edit here removes the navigation tabs. Keep this in
  # sync with the theme's own mkdocs_theme.yml; content.action.edit is
  # the single addition, pairing with edit_uri above.
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

# Material for MkDocs ships its own search implementation under the
# namespaced plugin id "material/search" (mkdocs-material 9.x). The
# theme's header template only renders the search box/icon for that exact
# id -- the plain "search" id MkDocs falls back to resolves to mkdocs'
# own built-in plugin instead, which the header silently ignores.
plugins:
  - material/search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - CLI Reference:
      - radio serve: cli/serve.md
      - radio station: cli/station.md
      - radio tokengen: cli/tokengen.md
  - Configuration:
      - Audio server (server.yaml): configuration/server-config.md
      - Station controller (station.yaml): configuration/station-config.md
  - Deployment:
      - Docker & Kubernetes: deployment/docker.md
  - Lua Scripting API:
      - Overview: lua-api/index.md
      - Registering & Queueing: lua-api/register-queue-status.md
      - Events & Scheduling: lua-api/events-and-scheduling.md
      - HTTP & SQL Modules: lua-api/http-and-sql-modules.md
      - Redis Module: lua-api/redis-module.md
      - io / os / require, JSON & YAML: lua-api/io-os-require-json-yaml.md
      - Editor Support (VS Code): lua-api/editor-support.md
  - Developer / Protocol API:
      - Overview: developer-api/index.md
      - Protocol Reference: developer-api/protocol-reference.md
      - Writing a Controller: developer-api/writing-a-controller.md
      - HTTP + JSON API: developer-api/http-json-api.md
      - Now Playing HTTP API: developer-api/now-playing-http-api.md
