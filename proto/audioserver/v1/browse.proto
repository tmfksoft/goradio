syntax = "proto3";

package audioserver.v1;

option go_package = "github.com/goradioserver/goradio/gen/go/audioserver/v1;audioserverv1";

// DirectoryEntry is one file or subdirectory under audio_root.
message DirectoryEntry {
  string name = 1;

  bool is_dir = 2;

  // "/"-separated, relative to audio_root -- the same form QueueTrack's
  // TrackSource.location expects for a TRACK_SOURCE_TYPE_LOCAL_FILE
  // source, so a file entry from a listing can be queued directly.
  string path = 3;

  // 0 for directories.
  int64 size_bytes = 4;
}

// ListDirectoryRequest lists the contents of one directory under
// audio_root. Not scoped to any station -- callers only need a valid
// token, not one authorized for a particular slug (same authorization
// model as ListStations); which entries come back instead depends on the
// token's own Dirs claim (see the auth package), which self-filters the
// listing exactly like ListStations self-filters by Slugs.
message ListDirectoryRequest {
  // Relative to audio_root; empty lists the root.
  string path = 1;
}

message ListDirectoryResponse {
  repeated DirectoryEntry entries = 1;
}
