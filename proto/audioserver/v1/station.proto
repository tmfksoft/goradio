syntax = "proto3";

package audioserver.v1;

option go_package = "github.com/tmfksoft/goradio/gen/go/audioserver/v1;audioserverv1";

// RegisterStationRequest registers (or re-registers) a station by slug.
// Re-registering an existing slug updates its metadata in place without
// disrupting the running queue/player, supporting controller reconnects.
message RegisterStationRequest {
  string slug = 1;
  string name = 2;
  string description = 3;
  // If > 0, the server fires an EVENT_TYPE_QUEUE_LOW event (once, edge-
  // triggered) whenever the pending queue length drops to or below this
  // threshold, so the controller doesn't have to poll GetStatus to know
  // when to queue more. 0 (the default) disables the event. Updated in
  // place on re-registration, same as name/description.
  int32 low_queue_threshold = 4;
}

message RegisterStationResponse {
  string slug = 1;
  string stream_url = 2;
  bool re_registered = 3;
}

// UnregisterStationRequest removes a station from the registry and stops
// its player goroutine/broadcaster. Any listeners currently subscribed to
// its stream are disconnected. This does not persist anywhere -- a
// controller that re-registers the same slug afterward starts a fresh
// station with an empty queue.
message UnregisterStationRequest {
  string slug = 1;
}

message UnregisterStationResponse {}

message ListStationsRequest {}

// StationSummary is the per-station listing returned by ListStations --
// deliberately lighter than GetStatusResponse (no queue/history), since
// this returns every station the caller is authorized for in one call.
message StationSummary {
  string slug = 1;
  string name = 2;
  int64 listener_count = 3;
}

message ListStationsResponse {
  // Only stations the caller's token authorizes (see Claims.HasSlug) --
  // never every registered station regardless of token scope.
  repeated StationSummary stations = 1;
}
