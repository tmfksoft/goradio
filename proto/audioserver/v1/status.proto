syntax = "proto3";

package audioserver.v1;

import "audioserver/v1/queue.proto";

option go_package = "github.com/tmfksoft/goradio/gen/go/audioserver/v1;audioserverv1";

message GetStatusRequest {
  string slug = 1;
}

message QueuedItemStatus {
  string queue_id = 1;
  TrackSource source = 2;
  QueueMode mode = 3;
  // 0 means unknown/indefinite -- always the case for a live relay (no
  // fixed length), and also briefly true for a pending item whose
  // prefetch hasn't finished yet (duration is only known once the source
  // is resolved to a cached file or classified as live).
  int64 duration_seconds = 4;
}

// HistoryEntryStatus is one item that finished playing, most-recent-last,
// capped at a small fixed number of entries (see GetStatusResponse.history).
message HistoryEntryStatus {
  string queue_id = 1;
  TrackSource source = 2;
  QueueMode mode = 3;
  int64 duration_seconds = 4;
  // "completed" or "interrupted" -- same values as TrackEndedPayload.reason.
  string reason = 5;
  int64 ended_at_unix_ms = 6;
}

message GetStatusResponse {
  string slug = 1;
  string name = 2;
  bool is_registered = 3;
  QueuedItemStatus current_track = 4;
  bool is_silence = 5;
  repeated QueuedItemStatus queue = 6;
  int64 listener_count = 7;
  int64 uptime_seconds = 8;
  // How long current_track has been playing. Only meaningful when
  // current_track is set (0 while playing silence).
  int64 current_track_elapsed_seconds = 9;
  // The most recently finished items, oldest first, capped at a small
  // fixed count. Meant to seed a dashboard's view on first load; keep it
  // current afterward from TRACK_ENDED events on SubscribeEvents rather
  // than re-polling GetStatus.
  repeated HistoryEntryStatus history = 10;
}
